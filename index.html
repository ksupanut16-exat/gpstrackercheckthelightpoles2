<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GPS Tracker + เสาไฟ (SP/HM + ไฟติด/ไฟดับ + เต็มจอ + ฟีเจอร์อัปเดตสถานะ + เสียงเตือนใกล้จุด)</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body { height: 100%; margin: 0; padding: 0; font-family: "Segoe UI", Tahoma, sans-serif; background: #f5f6fa; }
    #map { height: 100vh; width: 100%; z-index: 1; }

    /* ขยับปุ่มซูมลง ~50px */
    .leaflet-top.leaflet-left { top: 50px !important; }

    .status-bar {
      position: fixed; bottom: 10px; left: 10px;
      background: rgba(255,255,255,0.95);
      padding: 10px 14px; border-radius: 10px;
      font-size: 14px; box-shadow: 0 2px 6px rgba(0,0,0,0.25);
      z-index: 1000; line-height: 1.4; max-width: 90%;
    }

    .user-input {
      position: fixed; bottom: 65px; left: 10px;
      background: rgba(255,255,255,0.95);
      padding: 10px 12px; border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
      z-index: 2000; display: flex; align-items: center; gap: 8px;
    }
    .user-input input {
      border: 1px solid #ccc; border-radius: 6px;
      padding: 5px 8px; font-size: 14px; width: 150px;
    }

    .refresh-btn, .track-btn {
      position: fixed; top: 15px;
      background: #007bff; color: white; border: none;
      padding: 10px 14px; border-radius: 8px;
      font-size: 14px; font-weight: bold; cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      transition: background 0.2s ease; z-index: 2000;
    }
    .refresh-btn { right: 15px; }
    .track-btn { left: 15px; background: #28a745; }
    .track-btn.stop { background: #dc3545; }

    .legend {
      position: fixed; bottom: 20px; right: 20px;
      background: rgba(255,255,255,0.95);
      padding: 10px 12px; border-radius: 8px;
      font-size: 13px; box-shadow: 0 2px 6px rgba(0,0,0,0.25);
      line-height: 1.6; z-index: 9999;
    }
    .legend div { display: flex; align-items: center; gap: 6px; }
    .legend-color { width: 14px; height: 14px; border-radius: 50%; border: 1px solid #666; }

    .toast {
      position: fixed; top: 20px; right: 20px;
      background: #333; color: white;
      padding: 12px 20px; border-radius: 6px;
      font-size: 14px; opacity: 0;
      transition: opacity 0.5s, transform 0.3s;
      z-index: 3000; transform: translateY(-20px);
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    .btn-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .btn { border: none; border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 13px; }
    .btn-green { background: #28a745; color: #fff; }
    .btn-red   { background: #dc3545; color: #fff; }

    .leaflet-div-icon { background: transparent !important; border: none !important; box-shadow: none !important; }
  </style>
</head>
<body>
  <div class="user-input">
    <label for="username">👤 ผู้ตรวจ:</label>
    <input type="text" id="username" placeholder="ระบุชื่อผู้ตรวจ" />
  </div>

  <button id="trackBtn" class="track-btn">▶️ เริ่มติดตาม</button>
  <button id="refreshBtn" class="refresh-btn">🔄 อัปเดตตอนนี้</button>
  <div id="map"></div>
  <div id="status" class="status-bar">🕓 กำลังโหลดแผนที่...</div>

  <div class="legend">
    <b>🗺️ คำอธิบายสี:</b>
    <div><span class="legend-color" style="background: #ff66b2;"></span> SP</div>
    <div><span class="legend-color" style="background: #ffd54f;"></span> HM</div>
    <div><span class="legend-color" style="background: green;"></span> ไฟติด (A/B/AB)</div>
    <div><span class="legend-color" style="background: red;"></span> ไฟดับ (A/B/AB)</div>
  </div>

  <div id="toast" class="toast"></div>

  <!-- ✅ เสียงติ๊ง -->
  <audio id="ding" src="https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg" preload="auto"></audio>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    /* ===== CONFIG ===== */
    const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbxIPNhZzcPduLQONpuaiMNYP028ZvIZld6_s_mg5x1QFCOEKPF76jDs9RTyq01jbcglTg/exec";
    const PROXY = "https://corsproxy.io/?";
    const SHEET_ID = "1KTFaGCzmtjJtezumsWDXFdsWlpZtSriq2mEHe-ujGNc";
    const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

    /* ===== TUNING ===== */
    const MIN_STEP_M = 2;                 // บันทึกจุดใหม่เมื่อขยับเกิน 2 เมตร
    const NEAR_CHECK_MS = 3000;           // เช็คใกล้หมุดทุก 3 วิ (throttle)
    const ACCURACY_TRIGGER_MAX_M = 30;    // ไม่แจ้งเตือนถ้า accuracy > 30 ม.
    const ZOOM_IN_DIST_M = 5;             // เข้าใกล้ <=5 ม. ให้ซูม+เปิด popup
    const ZOOM_OUT_DIST_M = 10;           // ออกห่าง >=10 ม. ยกเลิกสถานะซูม
    const PER_PIN_COOLDOWN_MS = 90_000;   // คูลดาวน์ต่อหมุด 90 วิ
    const GLOBAL_COOLDOWN_MS  = 6_000;    // คูลดาวน์รวม 6 วิ
    const AUTO_FIT_ON_REFRESH_WHEN_NOT_TRACKING = true;

    window.onload = () => {
      const map = L.map('map').setView([13.736717, 100.523186], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

      const toast = document.getElementById("toast");
      const ding = document.getElementById("ding");
      const usernameInput = document.getElementById("username");
      const statusEl = document.getElementById("status");
      const trackBtn = document.getElementById("trackBtn");
      const refreshBtn = document.getElementById("refreshBtn");

      let markers = [];                   // รายการ Marker ทั้งหมด
      let markerByName = new Map();       // index เร็วขึ้นสำหรับ lookup
      let userMarker = null, userCircle = null;
      let userPath = [];                  // เก็บ latlng เป็น array
      let userPolyline = null;
      let watchID = null;
      let isZoomedIn = false;
      let firstDataLoaded = false;

      // สำหรับ throttling และ cooldown
      let lastNearCheckAt = 0;
      let lastGlobalNotifyAt = 0;
      const perPinNotifiedAt = new Map(); // key: marker.options.name, value: timestamp

      function showToast(msg, type="info") {
        toast.textContent = msg;
        toast.style.background = type === "success" ? "#28a745" : type === "error" ? "#dc3545" : "#333";
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 3000);
      }

      function colorForStatus(status) {
        if (!status) return "blue";
        if (/^SP/i.test(status)) return "#ff66b2";
        if (/^HM/i.test(status)) return "#ffd54f";
        if (/ไฟดับ/i.test(status)) return "red";
        if (/ไฟติด/i.test(status)) return "green";
        return "blue";
      }

      function circleIcon(color) {
        return L.divIcon({
          html: `<div style="background:${color};width:18px;height:18px;border-radius:50%;border:2px solid white;"></div>`,
          className: ''
        });
      }

      function sendStatusToSheet(name, newStatus) {
        const fullURL = PROXY + encodeURIComponent(WEBHOOK_URL);
        const user = usernameInput.value.trim() || "ไม่ระบุผู้ตรวจ";
        fetch(fullURL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, status: newStatus, user })
        })
        .then(r => r.json())
        .then(() => showToast(`✅ บันทึก "${newStatus}" แล้ว (${name})`, "success"))
        .catch(e => { console.error(e); showToast("❌ บันทึกล้มเหลว!", "error"); });
      }

      function createPopup(marker, name, status, color) {
        const div = document.createElement("div");
        div.innerHTML = `
          <b>${name}</b><br>
          🔰 <b id="statusText" style="color:${color}">${status || "-"}</b><br><br>
          <div class="btn-row">
            <button class="btn btn-green" id="onA">ไฟติด A</button>
            <button class="btn btn-green" id="onB">ไฟติด B</button>
            <button class="btn btn-green" id="onAB">ไฟติด AB</button>
            <button class="btn btn-red"   id="offA">ไฟดับ A</button>
            <button class="btn btn-red"   id="offB">ไฟดับ B</button>
            <button class="btn btn-red"   id="offAB">ไฟดับ AB</button>
          </div>
        `;
        const popup = L.popup().setContent(div);
        marker.bindPopup(popup);

        marker.on("popupopen", () => {
          const statusEl = div.querySelector("#statusText");
          function updateStatus(newStatus) {
            const newColor = colorForStatus(newStatus);
            statusEl.style.color = newColor;
            statusEl.textContent = newStatus;
            marker.setIcon(circleIcon(newColor));
            ding.currentTime = 0; ding.play();
            marker.closePopup();
            sendStatusToSheet(name, newStatus);
          }
          div.querySelector("#onA").onclick  = () => updateStatus("ไฟติดA");
          div.querySelector("#onB").onclick  = () => updateStatus("ไฟติดB");
          div.querySelector("#onAB").onclick = () => updateStatus("ไฟติดAB");
          div.querySelector("#offA").onclick = () => updateStatus("ไฟดับA");
          div.querySelector("#offB").onclick = () => updateStatus("ไฟดับB");
          div.querySelector("#offAB").onclick= () => updateStatus("ไฟดับAB");
        });
      }

      async function loadSheetData() {
        try {
          const res = await fetch(SHEET_URL);
          const text = await res.text();

          // ล้าง markers เก่า (ง่าย/เสถียร) — รีเฟรชทุก 5 นาที ผลกระทบต่ำ
          markers.forEach(m => map.removeLayer(m));
          markers = [];
          markerByName.clear();

          const json = JSON.parse(text.substring(47).slice(0, -2));
          const rows = json.table.rows;

          rows.forEach(r => {
            const name   = r.c[0]?.v;
            const lat    = r.c[1]?.v;
            const lng    = r.c[2]?.v;
            const status = r.c[8]?.v || ""; // คอลัมน์ Status
            if (name && lat && lng) {
              const color = colorForStatus(status);
              const m = L.marker([lat, lng], { icon: circleIcon(color), name }).addTo(map);
              createPopup(m, name, status, color);
              markers.push(m);
              markerByName.set(name, m);
            }
          });

          if (markers.length && (!firstDataLoaded || (AUTO_FIT_ON_REFRESH_WHEN_NOT_TRACKING && !watchID))) {
            map.fitBounds(L.featureGroup(markers).getBounds().pad(0.2));
            firstDataLoaded = true;
          }
          statusEl.innerHTML = "✅ อัปเดตล่าสุด: " + new Date().toLocaleTimeString();
        } catch (e) {
          console.error(e);
          statusEl.textContent = "❌ โหลดข้อมูลไม่สำเร็จ";
        }
      }

      function startTracking() {
        if (watchID) return;
        showToast("🚀 เริ่มติดตามตำแหน่ง...", "success");
        trackBtn.textContent = "⏸️ หยุดติดตาม";
        trackBtn.classList.add("stop");

        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(() => {});
        }

        watchID = navigator.geolocation.watchPosition(onPosition, onPositionError, {
          enableHighAccuracy: true,
          maximumAge: 1000,   // ยอมรับค่าล่าสุดที่ cache ไม่เกิน 1 วินาที
          timeout: 10000
        });
      }

      function stopTracking() {
        if (!watchID) return;
        navigator.geolocation.clearWatch(watchID);
        watchID = null;
        trackBtn.textContent = "▶️ เริ่มติดตาม";
        trackBtn.classList.remove("stop");
        showToast("🛑 หยุดติดตามแล้ว", "info");

        if (document.fullscreenElement) {
          document.exitFullscreen().catch(() => {});
        }
      }

      trackBtn.onclick = () => { if (watchID) stopTracking(); else startTracking(); };
      refreshBtn.onclick = loadSheetData;

      function onPosition(pos) {
        const { latitude, longitude, accuracy } = pos.coords;
        const now = Date.now();

        // สร้าง/อัปเดตตำแหน่งปัจจุบัน
        if (userMarker) map.removeLayer(userMarker);
        if (userCircle) map.removeLayer(userCircle);
        userMarker = L.marker([latitude, longitude], { icon: L.divIcon({ html: "📍" }) }).addTo(map);
        userCircle = L.circle([latitude, longitude], { radius: accuracy }).addTo(map);

        // เพิ่มจุดลงเส้นทางแบบมีเงื่อนไข (ลดจุดแน่นเกินไป)
        const newLatLng = L.latLng(latitude, longitude);
        if (userPath.length === 0) {
          userPath.push(newLatLng);
        } else {
          const last = userPath[userPath.length - 1];
          const moved = map.distance(last, newLatLng);
          if (moved >= MIN_STEP_M) userPath.push(newLatLng);
        }

        // วาด/ต่อเส้นด้วย addLatLng (ไม่ลบเส้นเดิม)
        if (userPolyline) {
          // เพิ่มเฉพาะกรณีเกิดจุดใหม่จริง ๆ (ตาม MIN_STEP_M)
          if (userPath.length >= 2) userPolyline.addLatLng(newLatLng);
        } else {
          userPolyline = L.polyline(userPath, { color: "#007bff", weight: 4 }).addTo(map);
        }

        // โฟกัสตำแหน่งปัจจุบัน
        map.setView([latitude, longitude], Math.max(map.getZoom(), 17));

        // อัปเดตสถานะหน้าจอ (สั้น กระชับ)
        statusEl.innerHTML = `📍 ${latitude.toFixed(5)}, ${longitude.toFixed(5)} (±${accuracy.toFixed(1)} m)`;

        // Throttle: เช็คใกล้หมุดเฉพาะทุก NEAR_CHECK_MS
        if (now - lastNearCheckAt >= NEAR_CHECK_MS) {
          lastNearCheckAt = now;
          checkNearbyMarkers(newLatLng, accuracy, now);
        }
      }

      function onPositionError() {
        showToast("⚠️ ไม่สามารถระบุตำแหน่งได้!", "error");
      }

      function checkNearbyMarkers(latlng, accuracy, nowTs) {
        // ถ้าความแม่นยำแย่เกินเกณฑ์ ให้เลื่อนผ่าน (ลด false positive)
        if (accuracy > ACCURACY_TRIGGER_MAX_M) return;

        let nearest = null;
        let nearestDist = Infinity;

        // หา marker ที่ใกล้สุด (วนลูปครั้งเดียว)
        for (const m of markers) {
          const d = map.distance(latlng, m.getLatLng());
          if (d < nearestDist) {
            nearest = m;
            nearestDist = d;
          }
        }

        if (!nearest) return;

        const name = nearest.options.name || "(ไม่ทราบชื่อ)";
        const lastPerPin = perPinNotifiedAt.get(name) || 0;
        const globalOk = (nowTs - lastGlobalNotifyAt) >= GLOBAL_COOLDOWN_MS;
        const perPinOk  = (nowTs - lastPerPin)        >= PER_PIN_COOLDOWN_MS;

        // logic เข้าใกล้
        if (nearestDist <= ZOOM_IN_DIST_M && globalOk && perPinOk && !isZoomedIn) {
          isZoomedIn = true;
          perPinNotifiedAt.set(name, nowTs);
          lastGlobalNotifyAt = nowTs;

          map.setView(nearest.getLatLng(), 19, { animate: true });
          nearest.openPopup();
          ding.currentTime = 0; ding.play();
          showToast(`📡 ใกล้จุด ${name} ระยะ ${nearestDist.toFixed(1)} ม.`, "info");
        }

        // ออกห่างมากพอ ให้คลายสถานะซูม (ครั้งเดียว)
        if (nearestDist >= ZOOM_OUT_DIST_M && isZoomedIn) {
          isZoomedIn = false;
        }
      }

      // โหลดครั้งแรก + ตั้งรีเฟรชทุก 5 นาที
      loadSheetData();
      setInterval(loadSheetData, 300000);

      // หยุดติดตามเมื่อแท็บถูกซ่อน (ประหยัดแบต/เน็ต) — เปิดใช้อีกครั้งเมื่อกลับมา
      document.addEventListener("visibilitychange", () => {
        if (document.hidden && watchID) stopTracking();
      });
    };
  </script>
</body>
</html>
